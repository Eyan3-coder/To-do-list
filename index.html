<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="to-do">
        <h1 class="toDo-text">To-do list</h1>
      </div>
      <div class="addTask">
        <input type="text" class="addBar" placeholder="Add your task" />
        <button class="addBtn" onclick="addTask()">Add</button>
      </div>

      <div class="list-container">
        <ul class="task-list"></ul>
      </div>
    </main>

    <script>
      const inputBox = document.querySelector(".addBar");
      const taskList = document.querySelector(".task-list");

      function addTask() {
        if (inputBox.value === "") {
          alert("Add some task");
          return;
        }

        const li = createTaskElement(inputBox.value);
        taskList.appendChild(li);
        inputBox.value = "";
        saveData();
      }

      function createTaskElement(taskText) {
        let li = document.createElement("li");
        li.textContent = taskText;
        li.style.backgroundColor = "white";
        li.style.borderRadius = "5px";
        li.style.marginBottom = "10px";
        li.style.padding = "10px";
        li.style.position = "relative";

        let checkBox = document.createElement("input");
        checkBox.type = "checkbox";
        checkBox.style.marginRight = "10px";
        checkBox.addEventListener("click", (e) => {
          e.stopPropagation();
          li.classList.toggle("completed");
          saveData();
        });

        let deleteBtn = document.createElement("button");
        deleteBtn.textContent = "X";
        deleteBtn.style.position = "absolute";
        deleteBtn.style.right = "10px";
        deleteBtn.style.top = "10px";
        deleteBtn.style.border = "none";
        deleteBtn.style.background = "none";
        deleteBtn.style.cursor = "pointer";
        deleteBtn.addEventListener("click", () => {
          li.remove();
          saveData();
        });

        li.prepend(checkBox);
        li.appendChild(deleteBtn);

        return li;
      }

      function saveData() {
        localStorage.setItem("task", taskList.innerHTML);
      }

      function showTask() {
        taskList.innerHTML = localStorage.getItem("task") || "";
        // Reattach event listeners to restored elements
        const reattach = taskList.querySelectorAll("li");
        reattach.forEach((li) => {
          const checkBox = li.querySelector("input[type='checkbox']");
          const deleteBtn = li.querySelector("button");

          checkBox?.addEventListener("click", (e) => {
            e.stopPropagation();
            li.classList.toggle("completed");
            saveData();
          });

          deleteBtn?.addEventListener("click", () => {
            li.remove();
            saveData();
          });
        });
      }

      showTask();
    </script>
  </body>
</html>
